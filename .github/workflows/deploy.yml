name: Deploy DORI WAR CARD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    name: Test game controls
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check game.js

      - name: Install Playwright
        run: npm init -y && npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local server
        run: |
          python3 -m http.server 4173 > /tmp/dori-server.log 2>&1 &
          echo $! > /tmp/dori-server.pid

      - name: Play through a full opening round
        run: |
          node - <<'NODE'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({headless:true});
            const page = await browser.newPage({viewport:{width:1440,height:1000}});
            const errors = [];
            page.setDefaultTimeout(5000);
            page.on('pageerror', e => errors.push(e.message));
            const step = m => console.log('[PLAYTEST]', m);
            await page.goto('http://127.0.0.1:4173', {waitUntil:'networkidle'});

            const active = id => page.locator(id).evaluate(el => el.classList.contains('active'));

            step('home');
            if (!(await page.locator('#startBtn').isVisible())) throw new Error('게임 시작 버튼이 보이지 않습니다.');
            step('start button');
            await page.locator('#startBtn').click({force:true});
            await page.waitForTimeout(100);
            if (!(await active('#setup'))) throw new Error('게임 시작 후 설정 화면이 열리지 않습니다.');

            step('begin battle setup');
            await page.locator('#begin').click({force:true});
            await page.waitForTimeout(1750);
            if (!(await active('#composition'))) throw new Error('전쟁 시작 후 구성 화면이 열리지 않습니다.');

            for (let player = 0; player < 2; player++) {
              step('composition player ' + player);
              await page.waitForTimeout(1750);
              for (let i = 0; i < 5; i++) {
                await page.locator('#compCards .card').nth(i).click({force:true});
              }
              if (await page.locator('#compCards .card.selected').count() !== 5) {
                throw new Error('5장 선택 상태가 정상적으로 유지되지 않습니다. player=' + player);
              }
              step('composition done ' + player);
              await page.locator('#compDone').click({force:true});
              await page.waitForTimeout(120);
              if (await page.locator('#modal.show').count()) throw new Error('첫 게임 시작에서 지도자 선택이 나타나면 안 됩니다. player=' + player);
            }

            if (!(await active('#battle'))) throw new Error('2명의 구성이 끝난 뒤 전투 화면으로 이동하지 않습니다.');
            if (await page.locator('#arena .player').count() !== 2) throw new Error('전투 플레이어 수가 2명이 아닙니다.');

            step('battle reached');
            const activeCard = page.locator('#arena .player.active .card.clickable').first();
            if (await activeCard.count() === 0) throw new Error('활성 플레이어의 행동 가능한 카드가 없습니다.');
            step('active card');
            await activeCard.click({force:true});
            await page.waitForTimeout(120);

            // Target-required actions must expose valid enemy/ally targets as clickable cards.
            if (await page.locator('#arena .player:not(.active) .card.clickable').count() > 0) {
              step('enemy target');
              await page.locator('#arena .player:not(.active) .card.clickable').first().click({force:true});
              await page.waitForTimeout(180);
            } else if (await page.locator('#modal.show .itemBtn').count() > 0) {
              step('leader skill');
              await page.locator('#modal.show .itemBtn').first().click({force:true});
              await page.waitForTimeout(120);
              if (await page.locator('#arena .player:not(.active) .card.clickable').count() > 0) {
                step('enemy target after skill');
                await page.locator('#arena .player:not(.active) .card.clickable').first().click({force:true});
                await page.waitForTimeout(180);
              }
            }

            step('4-player PvP opening');
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#startBtn').click({force:true});
            await page.locator('#counts .choice[data-v="4"]').click({force:true});
            await page.locator('#begin').click({force:true});
            for (let player = 0; player < 4; player++) {
              await page.waitForTimeout(1750);
              for (let i = 0; i < 5; i++) await page.locator('#compCards .card').nth(i).click({force:true});
              await page.locator('#compDone').click({force:true});
              await page.waitForTimeout(60);
              if (await page.locator('#modal.show').count()) throw new Error('첫 구성에서 지도자 선택이 나타나면 안 됩니다. player=' + player);
            }
            if (!(await active('#battle'))) throw new Error('4인 PvP가 전투까지 진행되지 않습니다.');
            if (await page.locator('#arena .player').count() !== 4) throw new Error('4인 PvP 전투 플레이어 수가 잘못되었습니다.');
            await page.locator('#endBtn').click({force:true});
            await page.waitForTimeout(100);

            step('2-player PvE opening');
            await page.reload({waitUntil:'networkidle'});
            await page.locator('#startBtn').click({force:true});
            await page.locator('#modes .choice[data-v="pve"]').click({force:true});
            await page.locator('#begin').click({force:true});
            for (let player = 0; player < 2; player++) {
              await page.waitForTimeout(1750);
              for (let i = 0; i < 5; i++) await page.locator('#compCards .card').nth(i).click({force:true});
              await page.locator('#compDone').click({force:true});
              await page.waitForTimeout(60);
              if (await page.locator('#modal.show').count()) {
                await page.locator('#modal.show .card').first().click({force:true});
                await page.waitForTimeout(60);
              }
            }
            if (!(await active('#battle'))) throw new Error('PvE가 전투까지 진행되지 않습니다.');
            await page.waitForTimeout(1000);

            if (errors.length) throw new Error('브라우저 JS 오류: ' + errors.join(' | '));
            await browser.close();
          })().catch(async e => { console.error(e); process.exit(1); });
          NODE

  deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
